# Docker 镜像内的 nginx 配置：托管前端 + 反代 /api 到 api 容器
# 该文件会在构建 web 镜像时拷贝到 /etc/nginx/conf.d/default.conf

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 接受较大的请求体（私钥、构建配置等）
    client_max_body_size 20m;

    # SPA 单页路由：未匹配到的静态文件请求统一回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API：注意 docker-compose.yml 内 api 服务名是 "api"
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 构建 / 上传可能耗时较长，调高超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 20m;

        # 关闭 buffer 让构建日志能近实时打到前端
        proxy_buffering off;
    }

    # 二维码图片走 /api/builds/:id/qrcode 已被上面规则覆盖；这里无需额外处理。

    # 静态资源开启 gzip
    gzip                on;
    gzip_min_length     1k;
    gzip_comp_level     6;
    gzip_types          text/plain application/javascript application/json text/css image/svg+xml;
    gzip_vary           on;
}
