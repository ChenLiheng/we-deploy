<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeDeploy - 微信小程序自动化打包与发布平台</title>
    <!--
      字体改为浏览器运行时按需加载，避免 less @import 在 vite build 阶段
      主动拉取 Google Fonts，导致离线 / 内网 / 墙后构建失败。
      crossorigin 属性是 Google Fonts 推荐写法，便于浏览器复用 CORS 字体资源。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
