# WeDeploy 一键启动编排
# ------------------------------------------------------------
# 用法：
#   1) 复制示例环境变量：cp .env.example .env，并填写 JWT_SECRET / APP_ENCRYPTION_KEY
#   2) 启动：             docker compose up -d --build
#   3) 浏览器访问：       http://<server-ip>:${WE_DEPLOY_PORT:-8000}
#   4) 初始管理员账号：   admin，初始密码见 docker compose logs api | grep "Initial admin password"
#
# 数据持久化目录：./data —— 含 SQLite 数据库 / 二维码 / 临时沙盒。
# 升级时直接 docker compose up -d --build 即可保留数据。
# ------------------------------------------------------------

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    image: we-deploy-api:latest
    container_name: we-deploy-api
    restart: unless-stopped
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DB_PATH: /data/we-deploy.db
      SANDBOX_BASE: /data/sandbox
      QRCODE_BASE: /data/qrcodes
      # 生产环境必填：缺失时 compose 直接报错，避免服务启动后登录/保存项目才 500
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（可用 openssl rand -hex 32 生成）}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?请在 .env 中设置 APP_ENCRYPTION_KEY（可用 openssl rand -hex 32 生成；设置后不要再修改）}
      # 可选：初始管理员密码（不设置则随机生成并打印到日志）
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      # miniprogram-ci 进程 cwd 落点，避免在项目目录写入临时文件
      # CI_PROC_CWD: /tmp/we-deploy/ci-proc
      #   - ./ssh:/root/.ssh:ro
    volumes:
      - ./data:/data
    expose:
      - "8080"
    networks:
      - we-deploy-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    image: we-deploy-web:latest
    container_name: we-deploy-web
    restart: unless-stopped
    ports:
      # 默认对外端口 8000，可通过 .env 中的 WE_DEPLOY_PORT 覆盖
      - "${WE_DEPLOY_PORT:-8000}:80"
    depends_on:
      - api
    networks:
      - we-deploy-net

networks:
  we-deploy-net:
    driver: bridge
